[package]
name = "pin"
version = "0.1.12"
edition = "2021"
rust-version = "1.80"
build = "build.rs"
license = "AGPL-3.0-or-later"
description = "Tiny Windows system-tray utility for pinning any window on top."
readme = "README.md"
repository = "https://github.com/Sqhh99/pin"
authors = ["sqhh99 <sqhh99@outlook.com>"]

[dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
] }

# Not target-gated: build-dependency cfgs are evaluated for the *host*, and
# build.rs must also run when cross-compiling to Windows from Linux.
[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
panic = "abort"
