name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pin-ci

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --target x86_64-pc-windows-msvc -- -D warnings

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Test
        run: cargo test --release --target x86_64-pc-windows-msvc

      - name: Build installer
        shell: pwsh
        run: .github/scripts/build-installer.ps1 -Version 0.0.0

  # The domain layer must stay platform-free; prove it by testing on Linux.
  domain:
    name: Test platform-free core (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pin-linux

      - name: Test
        run: cargo test --lib
