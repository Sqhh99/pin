name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pin-release

      # Cargo.toml is the single source of truth for the version.
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq 'pin').version
          if (-not $version) { throw 'Could not read the pin package version' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version (expected v$version)"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building Pin $version"

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Run tests
        run: cargo test --release --target x86_64-pc-windows-msvc

      - name: Verify embedded resources
        shell: pwsh
        run: |
          $exe = Get-Item target\x86_64-pc-windows-msvc\release\pin.exe
          $product = $exe.VersionInfo.ProductVersion
          if (-not $product -or -not $product.StartsWith('${{ steps.version.outputs.version }}')) {
            throw "pin.exe ProductVersion is '$product'; resources (icon/manifest/version) were not embedded"
          }
          Write-Host "pin.exe ProductVersion $product"

      - name: Build installer
        shell: pwsh
        run: .github/scripts/build-installer.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Build portable zip
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $staging = Join-Path $env:RUNNER_TEMP "pin-$version"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\pin.exe, LICENSE, README.md $staging
          Compress-Archive -Path "$staging\*" -DestinationPath "dist\pin-$version-windows-x64-portable.zip" -Force

      - name: Write checksums
        shell: pwsh
        run: |
          $assets = Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.zip' }
          if ($assets.Count -lt 2) { throw "Expected installer and portable zip in dist, found: $($assets.Name -join ', ')" }
          foreach ($asset in $assets) {
            $hash = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($asset.Name)" | Out-File -FilePath "$($asset.FullName).sha256" -Encoding ascii
          }
          Get-ChildItem dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pin-${{ steps.version.outputs.version }}-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
